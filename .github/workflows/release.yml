name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  # GitHub release (archives + checksums, with build provenance), AUR package.
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        # no build cache in release builds
        with: {go-version-file: go.mod, cache: false}
      # goreleaser/goreleaser-action v6
      - uses:
          goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a
        with: {version: "~> v2", args: release --clean}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
      # verify: gh attestation verify agm_darwin_arm64.tar.gz -R alpertarhan/agent-mesh
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/*.tar.gz"

  # Homebrew formula (builds from the tag's source): push bump/agent-mesh-<version>
  # to alpertarhan/homebrew-tap; its bottles workflow builds, tests and uploads
  # bottles, then moves main.
  homebrew:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: bump formula
        env:
          TAG: ${{ github.ref_name }}
          KEY: ${{ secrets.HOMEBREW_TAP_KEY }}
          SRC: https://github.com/${{ github.repository }}/archive/refs/tags/${{ github.ref_name }}.tar.gz
        run: |
          set -euo pipefail
          version=${TAG#v}
          sha=$(curl -fsSL --retry 5 "$SRC" | sha256sum | cut -d' ' -f1)
          install -m 600 /dev/null key && printf '%s\n' "$KEY" > key
          export GIT_SSH_COMMAND="ssh -i $PWD/key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone -q --depth 1 git@github.com:alpertarhan/homebrew-tap.git tap
          cd tap
          f=Formula/agent-mesh.rb
          sed -i -E "s|^  url \".*\"|  url \"$SRC\"|; s|^  sha256 \".*\"|  sha256 \"$sha\"|" "$f"
          # old bottles belong to the old version; the tap's CI writes new ones
          awk '/^  bottle do$/{skip=1} !skip{print} skip&&/^  end$/{skip=0; getline; if ($0!="") print}' "$f" > f.tmp && mv f.tmp "$f"
          git diff --stat
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qam "agent-mesh $version"
          git push -f origin "HEAD:refs/heads/bump/agent-mesh-$version"

  # npm (and bun): the same release binaries in one package.
  npm:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance, no token secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 24, registry-url: "https://registry.npmjs.org"}
      - name: build package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" -p 'agm_*.tar.gz' -D dl
          mkdir -p npm/dist
          for f in dl/agm_*.tar.gz; do
            n=$(basename "$f" .tar.gz) # agm_<os>_<arch>
            os=${n#agm_}; os=${os%_*}; arch=${n##*_}
            [ "$arch" = amd64 ] && arch=x64
            tar -xzf "$f" -C dl agm && mv dl/agm "npm/dist/agm-$os-$arch"
          done
          cp README.md LICENSE npm/
          cd npm && npm version --no-git-tag-version "${TAG#v}"
      - name: publish
        working-directory: npm
        env:
          TAG: ${{ github.ref_name }}
          PKG: "@alpertarhan/agent-mesh"
        run: |
          if npm view "$PKG@${TAG#v}" version >/dev/null 2>&1; then
            echo "already published"; exit 0
          fi
          npm publish --provenance --access public
